<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Confirmed - FoodieHub</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="success-container">
      <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for ordering with FoodieHub.</p>

        <h3>Your Order Details</h3>

        <p>
          Order ID:
          <strong id="orderId">-</strong>
        </p>

        <p>
          Total Items:
          <strong id="successItems">0</strong>
        </p>

        <p>
          Total Amount:
          <strong id="successAmount">₹0.00</strong>
        </p>

        <p>
          Order Date:
          <strong id="orderDate">-</strong>
        </p>

        <a href="index.html" class="home-btn"> Continue Shopping </a>
      </div>
    </div>

    <script src="js/success.js"></script>
  </body>
</html>
